<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <div class="teacher-access">
      <button id="teacher-login-toggle" type="button" aria-expanded="false">Teacher Sign In</button>
      <form id="teacher-login-form" class="hidden">
        <label for="teacher-username">Username</label>
        <input type="text" id="teacher-username" autocomplete="username" required />
        <label for="teacher-password">Password</label>
        <input type="password" id="teacher-password" autocomplete="current-password" required />
        <button type="submit">Sign In</button>
      </form>
      <div id="teacher-session" class="hidden">
        <span id="teacher-name"></span>
        <button id="teacher-logout" type="button">Sign Out</button>
      </div>
      <p id="auth-message" class="hidden" role="status"></p>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Manage Student Signups</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
